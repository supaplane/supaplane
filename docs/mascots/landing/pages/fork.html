<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supaplane · fork the fleet</title>
    <link rel="stylesheet" href="fleet.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="index.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 20 L21 12 L3 4 L8 12 Z" fill="#f5f0e8" />
        </svg>
        supaplane
      </a>
      <nav class="nav-links">
        <a href="bento.html">Bento</a>
        <a href="t3.html">T3</a>
        <a href="workbench.html">Workbench</a>
      </nav>
      <a class="btn btn-ghost" href="#">Star 14.2k</a>
    </header>

    <main class="hero">
      <h1>If you don't like the fleet, fork it.</h1>
      <p class="lede">
        MIT-licensed. One daemon on your machine. An open protocol. You own the data. Don't like it?
        Fork it.
      </p>
      <div class="term">
        <span>$ gh repo fork echohello-dev/supaplane</span><span class="ok">✓</span>
      </div>
      <div class="pills">
        <span class="pill">MIT</span>
        <span class="pill">local-first</span>
        <span class="pill">one daemon</span>
      </div>
      <div class="actions">
        <a class="btn btn-signal" href="#">Clone and fly</a>
      </div>
    </main>

    <div class="stage">
      <div class="fleet" aria-hidden="true">
        <div class="unit md breathe">
          <img src="../../anim/landing/sprites/cream-capsule.png" alt="" />
        </div>
        <div class="unit md bob">
          <img src="../../anim/landing/sprites/blush-capsule.png" alt="" />
        </div>
        <div class="unit sm hide-sm bob-slow">
          <img src="../../anim/landing/sprites/cream-tiny.png" alt="" />
        </div>
        <div class="unit md front bob-late">
          <video
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            poster="../../anim/landing/sprites/sage-walk-poster.png"
          >
            <source src="../../anim/landing/sprites/sage-walk.webm" type="video/webm" />
            <source src="../../anim/landing/sprites/sage-walk.mp4" type="video/mp4" />
          </video>
          <img class="fallback" src="../../anim/landing/sprites/sage-walk.png" alt="" />
        </div>
        <div class="unit lg hide-sm sway">
          <img src="../../anim/landing/sprites/sky-oval.png" alt="" />
        </div>
        <div class="unit md">
          <video
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            poster="../../anim/landing/sprites/terra-wave-poster.png"
          >
            <source src="../../anim/landing/sprites/terra-wave.webm" type="video/webm" />
            <source src="../../anim/landing/sprites/terra-wave.mp4" type="video/mp4" />
          </video>
          <img class="fallback" src="../../anim/landing/sprites/terra-wave.png" alt="" />
        </div>
        <div class="unit sm">
          <video
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            poster="../../anim/landing/sprites/cream-round-blink-poster.png"
          >
            <source src="../../anim/landing/sprites/cream-round-blink.webm" type="video/webm" />
            <source src="../../anim/landing/sprites/cream-round-blink.mp4" type="video/mp4" />
          </video>
          <img class="fallback" src="../../anim/landing/sprites/cream-round-plane.png" alt="" />
        </div>
        <div class="unit md hide-sm bob-slow">
          <img src="../../anim/landing/sprites/gold-round-plane.png" alt="" />
        </div>
        <div class="unit md sway-slow">
          <img src="../../anim/landing/sprites/cream-square.png" alt="" />
        </div>
      </div>
    </div>
    <script src="fleet.js"></script>
  </body>
</html>
